{% extends "base.html" %}
{% block content %}
<h2>Editar producto</h2>
<form method="post" class="stack">
  <label>Nombre <input name="nombre" value="{{ p.nombre }}" required></label>
  <label>Precio <input name="precio" type="number" step="0.01" min="0" value="{{ p.precio }}" required></label>
  <label>Stock <input name="stock" type="number" min="0" value="{{ p.stock }}" required></label>
  <button>Guardar cambios</button>
</form>
{% endblock %}
