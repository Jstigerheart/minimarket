{% extends "base.html" %}
{% block content %}
<h2>Productos</h2>
<form method="post" action="{{ url_for('producto_nuevo') }}" class="inline">
  <input name="nombre" placeholder="Nombre" required>
  <input name="precio" type="number" step="0.01" min="0" placeholder="Precio" required>
  <input name="stock" type="number" min="0" placeholder="Stock" required>
  <button>Agregar producto</button>
</form>
<table>
  <tr><th>Nombre</th><th>Precio</th><th>Stock</th><th></th></tr>
  {% for p in productos %}
  <tr class="{{ 'bajo' if p.stock <= minimo }}">
    <td>{{ p.nombre }}</td><td>${{ '{:,.0f}'.format(p.precio) }}</td><td>{{ p.stock }}</td>
    <td class="acciones">
      <a href="{{ url_for('producto_editar', pid=p.id) }}">Editar</a>
      <form method="post" action="{{ url_for('producto_eliminar', pid=p.id) }}" onsubmit="return confirm('¿Eliminar este producto?')">
        <button class="link">Eliminar</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="4">Aún no hay productos. Agrega el primero arriba.</td></tr>
  {% endfor %}
</table>
{% endblock %}
